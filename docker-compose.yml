version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pricepilot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pricepilot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricepilot_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricepilot}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pricepilot_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricepilot_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
