# render.yaml
# Blueprint for deploying the stack to Render.com

databases:
  - name: pricepilot-db
    databaseName: pricepilot_db
    user: pricepilot
    region: ohio
    plan: free

services:
  - type: web
    name: pricepilot-backend
    env: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricepilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RAPID_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZENROWS_API_KEY
        sync: false
      - key: SCRAPINGDOG_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

  - type: web
    name: pricepilot-frontend
    env: docker
    region: ohio
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        # Render provides the backend URL automatically. Append /api/v1 to it.
        # Ensure you replace this placeholder if you rename the backend service.
        value: ${pricepilot-backend.url}/api/v1
